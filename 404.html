<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Redirecting to GitHub Clone...</title>
  <script>
    // GitHub Pages SPA Hash Redirector
    const segmentCount = 1;
    const location = window.location;
    location.replace(
      location.protocol + '//' + location.hostname + (location.port ? ':' + location.port : '') +
      location.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
      location.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
      (location.search ? '&' + location.search.slice(1).replace(/&/g, '~and~') : '') +
      location.hash
    );
  </script>
</head>
<body style="background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; text-align: center; padding-top: 50px;">
  <p>Redirecting to repository...</p>
</body>
</html>
